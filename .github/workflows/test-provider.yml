name: Test provider

on:
  workflow_call:

permissions:
  contents: read

jobs:
  provider:
    name: Go
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      working_directory: provider
      go_version_file: provider/go.mod
      release_platforms: darwin/arm64 linux/amd64 linux/arm64
      apt_packages: cmake pkg-config
      darwin_runner: macos-15
      cgo: true

  tofu-plan:
    name: provider tofu plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Staticcheck-extra requires constant test input paths to use testdata.
      # Keep this copy aligned with validated gateway fixture.
      - name: Check network route fixture copies
        run: cmp gateway/yang/instances/network-routes.json provider/internal/provider/testdata/networkplan/network-routes.json
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      # Disable wrapper because TestTofuPlan reads tofu output directly.
      - &setup-tofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Plan network documents with OpenTofu
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C provider test-tofu-plan

  provider-package:
    needs: provider
    if: needs.provider.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *setup-tofu
      - uses: actions/download-artifact@v8
        with:
          name: release-provider-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/provider-package
      - name: Verify provider release package
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_PACKAGE: ${{ runner.temp }}/provider-package/terraform-provider-mwan_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          ALLOW_MISSING_CHECKSUMS: '1'
        run: TOFU="$(command -v tofu)" ./provider/scripts/test-release-package.sh
