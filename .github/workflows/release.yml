name: Release

# Releases the mwan artifacts every deploy installs. The deploy playbooks fetch
# a published archive by version, so this workflow is the only place a shipped
# binary is built.
#
# cgo stays off at the workflow level on purpose. The release set declares that
# the binary links libyang and libsysrepo through its own cgo=1 flag in
# RELEASE_BINS, so the linux artifact carries the publishing binding,
# statically linked. The C libraries are still provisioned, because the release
# engine runs the cgo-deps hook for any consumer that declares GO_MK_CGO_DEPS
# regardless of this input.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      apt_packages: libpcre2-dev
      platforms: linux/amd64
      # One binary name, verified after publish for every platform, so a
      # release that dropped an archive fails the run instead of shipping a
      # partial set.
      binary: mwan
