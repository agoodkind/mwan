name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release_modules.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      modules: '[{"working_directory":"gateway","cgo":true,"apt_packages":"libpcre2-dev"},{"working_directory":"provider","cgo":true,"apt_packages":"cmake pkg-config"}]'
      binary: mwan terraform-provider-mwan
