name: Release

# Releases the mwan artifacts every deploy installs. The deploy playbooks fetch
# a published archive by version, so this workflow is the only place a shipped
# binary is built.
#
# The one shipped binary links libyang and libsysrepo, and every release
# platform builds on a native runner with a C compiler. The cgo input matches
# that. It also turns on the compile job's cgo dependency cache, ccache, and
# target architecture.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      apt_packages: libpcre2-dev
      cgo: true
      platforms: linux/amd64 linux/arm64
      # One binary name, verified after publish for every platform, so a
      # release that dropped an archive fails the run instead of shipping a
      # partial set.
      binary: mwan
