name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  COMPOSE_ENV_FILES: ${{ github.workspace }}/build/wanconfig.env

jobs:
  compose-config:
    name: Validate gateway Compose (${{ matrix.arch }})
    strategy: &gateway-platforms
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache_service: systemd
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache_service: build
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSE_FILE: compose.build.yaml:compose.${{ matrix.arch }}.yaml
      WANCONFIG_CACHE_ID: ${{ github.run_id }}
      RELEASE_PLATFORMS: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate gateway configuration
        working-directory: gateway
        run: docker compose config --quiet
      - name: Save gateway builder layers
        uses: ./.github/actions/gateway-builder
        with:
          arch: ${{ matrix.arch }}
          service: ${{ matrix.cache_service }}
          export-cache: 'true'

  prepare:
    name: go / Prepare
    needs: compose-config
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Compose configurations to pass
        env:
          RESULT: ${{ needs.compose-config.result }}
        run: test "$RESULT" = success

  test:
    name: go
    needs: compose-config
    uses: ./.github/workflows/test.gateway.yml

  package:
    name: Gateway packages (${{ matrix.arch }})
    needs: compose-config
    strategy: *gateway-platforms
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  build:
    name: go / Build
    needs: [prepare, package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both native builds and their attested archives
        env:
          PREPARE: ${{ needs.prepare.result }}
          PACKAGES: ${{ needs.package.result }}
        run: |
          test "$PREPARE" = success
          test "$PACKAGES" = success

  provider:
    uses: ./.github/workflows/test.provider.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
