name: CI

# Run CI on every branch push, exactly once, with no duplication. There is no
# `pull_request` trigger: a same-repo PR would double-run (push + pull_request),
# and same-repo PRs already show these checks because GitHub matches checks to
# the head commit SHA. `'**'` matches branches but not tags, so the tag-driven
# release workflow is untouched.
on:
  push:
    branches: ['**']

# Feature branch CI runs cancel superseded runs, and default branch CI runs are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      working_directory: gateway
      go_version_file: gateway/go.mod
      # libyang2-tools supplies yanglint for the YANG model gate, and
      # libpcre2-dev is what the pinned libyang links against when the
      # cgo-deps hook builds it.
      apt_packages: libyang2-tools libpcre2-dev
      go_tool_packages: github.com/bufbuild/buf/cmd/buf@latest google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11 google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      # Each module's Makefile sets its release platforms through RELEASE_PLATFORMS.
      # The build gate compiles the gateway platforms on native runners with cgo.
      release_platforms: linux/amd64 linux/arm64
      cgo: true

  # The provider does not require the gateway's C libraries.
  provider:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      working_directory: provider
      go_version_file: provider/go.mod
      release_platforms: darwin/arm64 linux/amd64 linux/arm64

  # The drift comparison requires the gateway's libsysrepo builder image.
  drift:
    name: provider drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Compare mwan install with the provider data
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make test-provider-drift WANCONFIG_DOCKER_ARCH=amd64

  tofu-plan:
    name: provider tofu plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The testdata copy must match the validated gateway fixture because staticcheck-extra rejects constant input paths outside testdata.
      - name: Check network route fixture copies
        run: cmp gateway/yang/instances/network-routes.json provider/internal/provider/testdata/networkplan/network-routes.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      # Disable the wrapper because TestTofuPlan reads tofu output directly.
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Plan network documents with OpenTofu
        env:
          GH_TOKEN: ${{ github.token }}
        run: make -C provider test-tofu-plan

  # The go job above never runs these. The Makefile hangs the two schema gates
  # off `check`, and the go-makefile quality matrix runs a fixed list of
  # commands that does not include it, so without this job nothing validates
  # the model outside a developer's own machine. The gates run here as their
  # own named check, because a schema failure and a Go failure are different
  # problems and a red check should say which one broke.
  #
  # The deploy runs this same yanglint validation against the rendered network
  # configuration before it writes anything to the gateway, so a model or an
  # instance document that fails here would fail a deploy instead.
  yang:
    name: yang gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gates are make targets, and the Makefile resolves the Go
      # environment while make parses it, so Go is a hard dependency even
      # though this job compiles nothing.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # libyang2-tools provides yanglint, which both gates run.
      - name: Install yanglint
        run: sudo apt-get update && sudo apt-get install -y libyang2-tools
      # The Makefile fetches go-makefile through gh while make parses it, so
      # the token keeps that fetch on the authenticated API path instead of
      # its anonymous raw fallback.
      - name: Validate the YANG model and its instance documents
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make yang-validate yang-validate-instances

  # This job exists because the netns-tagged tests create a private network
  # namespace and build links, routes and policy rules inside it, which needs
  # root. The go job above runs its tests as the unprivileged runner user, so
  # it builds without the tag and never runs them.
  netns:
    name: mwan netns tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # The Makefile fetches go-makefile through gh while make parses it, so
      # the token keeps that fetch on the authenticated API path instead of
      # its anonymous raw fallback.
      - name: Run the network namespace tests as root
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make test-netns

  # The firewall tests need the privileged builder and cgo schema libraries.
  firewall:
    name: mwan firewall tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: agoodkind/configs
          ref: c6a9a869bc57a5bb69326681416b3d4661aa278b
          path: .protocol-configs
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Verify the original release and run its preparation upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          MWAN_NPT_LEGACY_SHA256: 1c79542f6f9e56fc0ad0f101b0688a84f95bfc41706ebebf36982e0f4f8726fa
        working-directory: gateway
        run: |
          mkdir -p "$RUNNER_TEMP/mwan-original"
          gh release download 202609292152-70-d442ba1 --repo agoodkind/mwan --pattern mwan_linux_amd64.tar.gz --dir "$RUNNER_TEMP/mwan-original"
          tar -xzf "$RUNNER_TEMP/mwan-original/mwan_linux_amd64.tar.gz" -C "$RUNNER_TEMP/mwan-original" mwan
          printf '%s  %s\n' "$MWAN_NPT_LEGACY_SHA256" "$RUNNER_TEMP/mwan-original/mwan" | sha256sum --check --strict
          make test-legacy-upgrade WANCONFIG_DOCKER_ARCH=amd64 MWAN_NPT_LEGACY_BINARY="$RUNNER_TEMP/mwan-original/mwan" MWAN_NPT_LEGACY_SHA256="$MWAN_NPT_LEGACY_SHA256"
      - name: Run the firewall and namespace acceptance tests
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make test-firewall test-protocol-namespace
      - name: Run the systemd acceptance tests
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make test-protocol-systemd MWAN_OWNED_ROLE_CONFIGS="$GITHUB_WORKSPACE/.protocol-configs"
      - name: Upload protocol execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mwan-protocol-results-${{ github.run_attempt }}
          path: gateway/bin/protocol-results/
          if-no-files-found: warn

  # The go job's quality matrix runs the suite on amd64 runners only. This job
  # runs the whole suite, cgo binding included, in the arm64 builder image on
  # a native arm64 runner.
  arm64:
    name: mwan arm64 tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # The Makefile resolves the Go environment while make parses it, so Go
      # is a hard dependency even though the suite runs in the container.
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # The Makefile fetches go-makefile through gh while make parses it, so
      # the token keeps that fetch on the authenticated API path instead of
      # its anonymous raw fallback.
      - name: Run the suite in the arm64 builder image
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: gateway
        run: make test-docker WANCONFIG_DOCKER_ARCH=arm64
