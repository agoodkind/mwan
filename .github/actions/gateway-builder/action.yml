name: Cache gateway builder layers
description: Import gateway builder layers into the Buildx builder used by Compose.
inputs:
  arch:
    description: Native gateway architecture, amd64 or arm64.
    required: true
  service:
    description: Compose service to build.
    default: build
  export-cache:
    description: Export layers to GitHub Actions after building the image.
    default: 'false'

runs:
  using: composite
  steps:
    - id: buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        driver: docker-container

    - name: Resolve the gateway builder target
      shell: bash
      working-directory: gateway
      env:
        SERVICE: ${{ inputs.service }}
      run: |
        docker compose build --print "$SERVICE" > "$RUNNER_TEMP/gateway-builder.json"

    - name: Build the gateway builder with cached layers
      uses: docker/bake-action@v7.5.0
      with:
        source: .
        files: ${{ runner.temp }}/gateway-builder.json
        targets: ${{ inputs.service }}
        builder: ${{ steps.buildx.outputs.name }}
        load: ${{ inputs.export-cache != 'true' }}
        set: |
          ${{ inputs.service }}.cache-from=type=gha,scope=mwan-gateway-builder-${{ inputs.arch }}
          ${{ inputs.export-cache == 'true' && 'build.output=type=cacheonly' || '' }}
          ${{ inputs.export-cache == 'true' && format('build.cache-to=type=gha,scope=mwan-gateway-builder-{0},mode=max', inputs.arch) || '' }}
