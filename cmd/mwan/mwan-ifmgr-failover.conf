# Drop-in for the failover container, prescribed by mwan-ifmgr.service's own
# ProtectKernelTunables comment. One unit body serves every ifmgr host and
# each deployment that needs the sandbox relaxed says so in a drop-in.
#
# slaac_health writes net.ipv6.conf.<iface>.disable_ipv6, so this role needs
# writable IPv6 sysctls. Everything else the base unit sets stays as it is.
#
# BindReadOnlyPaths is reset to empty because no failover-role module reads
# /root/.ssh: the wg module that needs it belongs to the oob role. Leaving the
# base unit's entry in place would hand the container's service read access to
# root's SSH credentials that the unit this replaces never granted.
[Unit]
Description=MWAN ifmgr (eth0 health for failover role)

[Service]
ProtectKernelTunables=false

# ReadWritePaths is a list, and a drop-in appends to it, so the empty
# assignment first resets it. Without that reset the effective value repeats
# the base unit's three paths before these four. The paths would still be
# writable, but the property no longer reads as the list anyone wrote.
ReadWritePaths=
ReadWritePaths=/var/log /var/run /run /proc/sys/net/ipv6/conf

BindReadOnlyPaths=
