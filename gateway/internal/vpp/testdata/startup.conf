unix {
  nodaemon
  nosyslog
  poll-sleep-usec {{.IdleWaitUsec}}
  runtime-dir {{.Directory}}
  log {{.Directory}}/vpp.log
  pidfile {{.Directory}}/vpp.pid
}
socksvr { socket-name {{.APISocket}} }
api-segment { prefix {{.Prefix}} }
cpu { workers 1 }
memory { main-heap-size 128M main-heap-page-size 4K }
buffers { buffers-per-numa 4096 page-size 4K }
statseg { socket-name {{.StatsSocket}} size 16M page-size 4K }
plugins {
  plugin default { disable }
  plugin tap_plugin.so { enable }
  plugin nat64_plugin.so { enable }
}
