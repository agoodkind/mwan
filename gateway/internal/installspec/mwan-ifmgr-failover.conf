# The failover role writes IPv6 sysctls for SLAAC health and IPv4 sysctls for
# DHCPv4 address promotion. Its DHCPv4 journal uses /var/lib/mwan.
# The OOB role alone reads /root/.ssh, so clear that inherited bind mount.
[Unit]
Description=MWAN ifmgr (eth0 health for failover role)

[Service]
ProtectKernelTunables=false
StateDirectory=mwan

# Reset the inherited list before setting the failover write paths.
ReadWritePaths=
ReadWritePaths=/var/log /var/run /run /var/lib/mwan /proc/sys/net/ipv4/conf /proc/sys/net/ipv6/conf

BindReadOnlyPaths=
