x-platform: &platform
  platform: linux/arm64
  environment:
    WANCONFIG_DOCKER_ARCH: arm64
    GO_MK_PLATFORMS: linux/arm64

x-builder: &builder
  <<: *platform
  image: mwan-wanconfig-builder:arm64

x-network-tests: &network-tests
  <<: *platform
  image: mwan-network-tests:arm64

services:
  build: *builder
  check: *builder
  proto: *builder
  bpf:
    <<: *builder
    environment:
      C_INCLUDE_PATH: ${NPT_BPF_INCLUDE:-/usr/include/aarch64-linux-gnu}
  test: *builder
  check-yang: *builder
  yang-validate: *builder
  yang-validate-instances: *builder
  firewall: *builder
  ovs:
    <<: *platform
    image: mwan-ovs-tests:arm64
  release:
    <<: *platform
    image: mwan-release-builder:arm64
  netns: *network-tests
  protocol-namespace: *network-tests
  systemd:
    <<: *platform
    image: mwan-systemd-tests:arm64
  provider-drift:
    <<: *platform
    image: mwan-provider-drift:arm64
  stack-build:
    platform: linux/arm64
    command: [-verify, /bundle/wanconfig-stack_linux_arm64.tar.gz, -out, /out]
  stack-verify:
    platform: linux/arm64
    command: [-verify, /bundle/wanconfig-stack_linux_arm64.tar.gz]

volumes:
  gomod:
    name: mwan-gomod-${WANCONFIG_CACHE_ID:?Supply checkout cache ID}-arm64
  cache:
    name: mwan-build-${WANCONFIG_CACHE_ID:?Supply checkout cache ID}-arm64
  gomk:
    name: mwan-gomk-${WANCONFIG_CACHE_ID:?Supply checkout cache ID}-arm64
