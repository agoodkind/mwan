services:
  systemd:
    extends:
      file: compose.build.yaml
      service: build
    image: mwan-systemd-tests:${WANCONFIG_DOCKER_ARCH}
    build:
      target: systemd-tests
    # Disable Docker init so systemd runs as PID 1.
    init: false
    privileged: true
    cgroup: private
    security_opt:
      - label=disable
    tmpfs:
      - /run
      - /run/lock
    environment:
      GOWORK: "off"
      GOFLAGS: -buildvcs=false
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /src
    volumes:
      - type: bind
        source: ..
        target: /src
        bind:
          create_host_path: false
      - gomod:/go/pkg/mod
      - cache:/root/.cache
      - gomk:/src/gateway/.make
    command: [/sbin/init]
    healthcheck:
      test: ["CMD", "systemctl", "show", "--property=Version", "--value"]
      interval: 200ms
      timeout: 1s
      retries: 150
      start_period: 1s

volumes:
  gomod:
    name: mwan-gomod-${WANCONFIG_CACHE_ID:?Supply the checkout cache ID}-${WANCONFIG_DOCKER_ARCH}
  cache:
    name: mwan-build-${WANCONFIG_CACHE_ID:?Supply the checkout cache ID}-${WANCONFIG_DOCKER_ARCH}
  gomk:
    name: mwan-gomk-${WANCONFIG_CACHE_ID:?Supply the checkout cache ID}-${WANCONFIG_DOCKER_ARCH}

networks:
  default:
    enable_ipv4: true
    enable_ipv6: true
