[package]
name = "mwan-native-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mwan-native = { path = "..", default-features = false }

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "kernel_observation"
path = "fuzz_targets/kernel_observation.rs"
test = false
doc = false
bench = false
